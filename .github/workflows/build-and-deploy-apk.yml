name: Build and Deploy Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Release APK
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          # 针对现代主流安卓手机 (如真我、小米、华为等 64 位芯片) 构建专属精简包，体积从 50MB 降至约 15MB
          flutter build apk --release --target-platform android-arm64 --build-name="${VERSION_NAME}" --build-number="${BUILD_NUM}"

      - name: Prepare Release Artifacts and version.json
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          
          # 检查文件大小
          FILE_BYTES=$(stat -c%s "$APK_SRC" 2>/dev/null || stat -f%z "$APK_SRC")
          FILE_SIZE_MB=$(echo "scale=1; $FILE_BYTES / 1048576" | bc)MB
          
          # 获取最近一条提交信息作为更新日志
          COMMIT_LOG=$(git log -1 --pretty=%B | head -n 3 | tr '\n' ' ' | sed 's/"/\\"/g')
          if [ -z "$COMMIT_LOG" ]; then
            COMMIT_LOG="日常优化与问题修复"
          fi
          
          # 创建输出目录
          mkdir -p release_dist
          cp "$APK_SRC" release_dist/onehubapp-latest.apk
          
          # 生成供手机端读取的 version.json
          cat <<EOF > release_dist/version.json
          {
            "versionCode": ${BUILD_NUM},
            "versionName": "${VERSION_NAME}",
            "minVersionCode": 1,
            "downloadUrl": "https://api.onehubai.online/static/apk/onehubapp-latest.apk",
            "fileSize": "${FILE_SIZE_MB}",
            "updateLog": "${COMMIT_LOG}",
            "publishDate": "$(date +'%Y-%m-%d %H:%M')",
            "forceUpdate": false
          }
          EOF
          
          echo "Generated version.json:"
          cat release_dist/version.json

      - name: Ensure target directory exists on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            mkdir -p /root/onehubserver/static/apk/

      - name: Upload APK and version.json to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "release_dist/*"
          target: "/root/onehubserver/static/apk/"
          strip_components: 1
